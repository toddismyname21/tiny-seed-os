services:
  - type: web
    name: tinypm-brain
    runtime: python
    rootDir: tinypm
    buildCommand: pip install -r requirements_brain.txt
    startCommand: python brain_bridge.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health
