        async function confirmBulkAssign() {
            const employeeId = document.getElementById('bulk-assign-employee').value;
            if (!employeeId) {
                showToast('Please select an employee', 'error');
                return;
            }

            const employeeName = getEmployeeName(employeeId);
            const taskIds = Array.from(state.selectedTasks);

            showToast(`Assigning ${taskIds.length} tasks to ${employeeName}...`, 'info');

            try {
                // Optimistic update
                taskIds.forEach(taskId => {
                    const task = state.tasks.find(t => t.id === taskId);
                    if (task) {
                        task.assignedTo = employeeId;
                        task.assignedToName = employeeName;
                    }
                });
                renderTasks();

                // API call
                const response = await fetch(`${API_URL}?action=bulkAssignTasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ taskIds, employeeId, employeeName })
                });

                closeBulkAssignModal();
                cancelBulkMode();
                showToast(`${taskIds.length} tasks assigned to ${employeeName}`, 'success');

                // Refresh data
                setTimeout(() => loadWorkload(), 500);
            } catch (error) {
                console.error('Bulk assign error:', error);
                showToast('Failed to assign tasks', 'error');
                loadTasks(true); // Refresh to get actual state
            }
        }

        async function bulkComplete() {
            if (state.selectedTasks.size === 0) return;

            const taskIds = Array.from(state.selectedTasks);
            showToast(`Marking ${taskIds.length} tasks as complete...`, 'info');

            try {
                // Optimistic update - remove from list
                state.tasks = state.tasks.filter(t => !state.selectedTasks.has(t.id));
                renderTasks();
                updateStats();

                // API call
                await fetch(`${API_URL}?action=bulkCompleteTasks`, {

                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ taskIds })
                });

                cancelBulkMode();
                showToast(`${taskIds.length} tasks completed!`, 'success');
            } catch (error) {
                console.error('Bulk complete error:', error);
                showToast('Failed to complete tasks', 'error');
                loadTasks(true);
            }

        async function saveTask(event) {
            event.preventDefault();

            const title = document.getElementById('task-title').value.trim();
            const description = document.getElementById('task-desc').value.trim();
            const employeeId = document.getElementById('task-employee').value;
            const dueDate = document.getElementById('task-date').value;

                showToast('Please fill in required fields', 'error');

            const employeeName = getEmployeeName(employeeId);
            const taskData = {
                description: title,
                task: title,
                notes: description,
                employeeId,
                employeeName,
                dueDate,
                dueTime,
                priority: state.selectedPriority,
                location,
                sendSMS: true
            };

            showToast(state.editingTaskId ? 'Updating task...' : 'Creating task...', 'info');

            try {
                const action = state.editingTaskId ? 'updateTask' : 'assignTaskToEmployee';
                if (state.editingTaskId) {

                }

                const response = await fetch(`${API_URL}?action=${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(taskData)
                });

                closeCreateModal();
                showToast(state.editingTaskId ? 'Task updated!' : `Task assigned to ${employeeName}`, 'success');

                // Refresh
                await loadTasks(true);
                loadWorkload();
            } catch (error) {
                console.error('Save task error:', error);
                showToast('Failed to save task', 'error');
            }

        // UTILITIES
        // ═══════════════════════════════════════════════════════════════════════════
        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            if (date.toDateString() === today.toDateString()) return 'Today';
            if (date.toDateString() === tomorrow.toDateString()) return 'Tomorrow';

            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

            const container = document.getElementById('ff-category-filter');
            container.innerHTML = Array.from(cats).map(c =>
                `<span class="ff-category-chip ${c === ffActiveCategory ? 'active' : ''}" onclick="filterFFCategory('${c}')">${c === 'all' ? 'All' : c.charAt(0).toUpperCase() + c.slice(1)}</span>`

            ffActiveCategory = cat;
            renderFFCategories();
            renderFeatureFlags();
        }

        function renderFeatureFlags() {
            const filtered = ffActiveCategory === 'all'
                ? featureFlags
                : featureFlags.filter(f => f.category === ffActiveCategory);

            const container = document.getElementById('ff-list');
            const countEl = document.getElementById('ff-count');
            const enabledCount = featureFlags.filter(f => f.enabled).length;
            countEl.textContent = `(${enabledCount}/${featureFlags.length} on)`;

            if (filtered.length === 0) {
                container.innerHTML = '<div class="ff-empty">No flags in this category</div>';
                return;
            }

            container.innerHTML = filtered.map(flag => `
                <div class="ff-item">
                    <label class="ff-toggle">
                        <input type="checkbox" ${flag.enabled ? 'checked' : ''} onchange="toggleFeatureFlag('${flag.key}', this.checked)">
                        <span class="ff-toggle-slider"></span>
                    </label>
                    <div class="ff-info">
                        <div class="ff-name">${flag.key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</div>
                        <div class="ff-desc">${flag.description || ''}</div>
                    </div>
                    ${flag.category ? `<span class="ff-badge ${flag.category}">${flag.category}</span>` : ''}
                </div>
            `).join('');
        }

        async function toggleFeatureFlag(key, enabled) {
            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'updateFeatureFlag', key, enabled })
                });
                const result = await resp.json();
                if (result.success) {
                    const flag = featureFlags.find(f => f.key === key);
                    if (flag) flag.enabled = enabled;
                    renderFeatureFlags();
                    showToast(`${key.replace(/_/g, ' ')} ${enabled ? 'enabled' : 'disabled'}`, 'success');
                } else {
                    showToast(result.error || 'Failed to update flag', 'error');
                    loadFeatureFlags();
                }
            } catch (err) {
                console.error('Toggle flag error:', err);
                showToast('Failed to update flag', 'error');
                loadFeatureFlags();
            }
        }

        // Load feature flags on startup
        loadFeatureFlags();

        // Debounce helper
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // Close modals on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeCreateModal();
                closeBulkAssignModal();
                if (document.getElementById('sidebar-panels').classList.contains('show')) {
                    toggleSidebar();
                }
            }
        });

        // Close modals on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('show');
                }
            });
        });
    </script>
<script src="shared-nav.js"></script>
</body>
</html>
