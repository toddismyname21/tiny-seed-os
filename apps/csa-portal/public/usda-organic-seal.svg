<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-label="USDA Organic">
  <defs>
    <clipPath id="seal-inner">
      <circle cx="300" cy="290" r="248"/>
    </clipPath>
  </defs>

  <!-- White field -->
  <circle cx="300" cy="290" r="248" fill="#ffffff"/>

  <!-- Lower black region with a gentle field-horizon arc -->
  <g clip-path="url(#seal-inner)">
    <path d="M 40,300 Q 300,266 560,300 L 560,620 L 40,620 Z" fill="#000000"/>
    <!-- Furrow lines fanning toward a horizon point (the plowed-field motif) -->
    <g stroke="#7c7c7c" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M 70,540 Q 250,430 332,316"/>
      <path d="M 180,560 Q 300,440 348,318"/>
      <path d="M 320,566 Q 348,450 366,320"/>
      <path d="M 470,556 Q 412,448 384,320"/>
      <path d="M 545,520 Q 452,432 400,322"/>
    </g>
  </g>

  <!-- USDA (black, on the white top) -->
  <text x="300" y="248" text-anchor="middle" fill="#000000"
        font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900"
        font-size="118" letter-spacing="-3" textLength="250" lengthAdjust="spacingAndGlyphs">USDA</text>

  <!-- ORGANIC (white, on the black band) -->
  <text x="300" y="392" text-anchor="middle" fill="#ffffff"
        font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900"
        font-size="80" letter-spacing="-1" textLength="356" lengthAdjust="spacingAndGlyphs">ORGANIC</text>

  <!-- Bold ring -->
  <circle cx="300" cy="290" r="259" fill="none" stroke="#000000" stroke-width="20"/>
  <circle cx="300" cy="290" r="284" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Registered-trademark mark, bottom-right -->
  <g>
    <circle cx="560" cy="548" r="15" fill="none" stroke="#000000" stroke-width="3"/>
    <text x="560" y="555" text-anchor="middle" fill="#000000"
          font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18">R</text>
  </g>
</svg>
