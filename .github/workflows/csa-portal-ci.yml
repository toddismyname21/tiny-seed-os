name: CSA Portal CI

# Quality harness for apps/csa-portal: build → Playwright E2E (+ axe) →
# Lighthouse budget. Runs only when portal files change.
#
# Required repository SECRETS (Settings → Secrets and variables → Actions):
#   PUBLIC_SUPABASE_URL         Supabase project URL
#   PUBLIC_SUPABASE_ANON_KEY    Supabase anon key
#   SUPABASE_SERVICE_ROLE_KEY   Supabase service-role key (test auth + seeding)
# Optional:
#   E2E_TEST_EMAIL              test member email (defaults to test@test.com)
#
# Until those secrets are added, the e2e + lighthouse jobs will fail at the
# "verify secrets" gate with a clear message (the workflow itself is correct).

on:
  push:
    branches: [csa-migration, main]
    paths:
      - 'apps/csa-portal/**'
      - '.github/workflows/csa-portal-ci.yml'
  pull_request:
    paths:
      - 'apps/csa-portal/**'
      - '.github/workflows/csa-portal-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/csa-portal

env:
  PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
  PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL || 'test@test.com' }}

jobs:
  build-and-check:
    name: Build + astro check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/csa-portal/package-lock.json
      - run: npm ci
      - name: astro check (type errors)
        run: npx astro check
      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E + axe a11y
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/csa-portal/package-lock.json
      - run: npm ci

      - name: Verify Supabase test secrets are present
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ] || [ -z "$PUBLIC_SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing Supabase secrets. Add PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY, and SUPABASE_SERVICE_ROLE_KEY in repo Settings → Secrets → Actions."
            exit 1
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build (preview server serves the built site)
        run: npm run build

      - name: Run Playwright E2E + axe
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/csa-portal/playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse budget (mobile)
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/csa-portal/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Run Lighthouse CI
        run: npm run lhci
      - name: Upload Lighthouse results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: apps/csa-portal/.lighthouseci/
          retention-days: 14
