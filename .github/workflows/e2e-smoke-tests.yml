name: E2E Smoke Tests

on:
  push:
    branches:
      - main
    paths:
      - 'web_app/**'
      - '*.html'
      - 'apps_script/**'
      - 'e2e-tests/**'
      - '.github/workflows/e2e-smoke-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web_app/**'
      - '*.html'
      - 'apps_script/**'
      - 'e2e-tests/**'
      - '.github/workflows/e2e-smoke-tests.yml'
  workflow_dispatch:

jobs:
  e2e-smoke-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install -D @playwright/test http-server

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start local server
        run: |
          npx http-server . -p 3000 --cors -s &
          sleep 3
          # Verify server is up
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/web_app/index.html || echo "Server check returned non-200"
        env:
          CI: true

      - name: Run E2E Smoke Tests
        id: tests
        run: |
          npx playwright test --config=e2e-tests/playwright.config.ts --reporter=list,json --output=test-results
        env:
          CI: true
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results.json
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure() || steps.tests.outcome == 'failure'
        with:
          name: failure-screenshots
          path: test-results/**/*.png
          retention-days: 30

      - name: Generate failure summary
        if: steps.tests.outcome == 'failure'
        run: |
          echo "## E2E Smoke Test Failures" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more pages failed smoke tests. Check artifacts for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to fix" >> $GITHUB_STEP_SUMMARY
          echo "1. Review failure screenshots in the artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Check for uncaught JS errors in the page" >> $GITHUB_STEP_SUMMARY
          echo "3. Verify element IDs match between HTML and JavaScript" >> $GITHUB_STEP_SUMMARY
          echo "4. Run locally: \`npx playwright test --config=e2e-tests/playwright.config.ts\`" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR with failure details
        if: github.event_name == 'pull_request' && steps.tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## E2E Smoke Test Failures

            One or more pages failed smoke tests. This may indicate:
            - Uncaught JavaScript errors
            - Missing or empty page content
            - Broken element references

            Please review the test artifacts for failure screenshots and details.

            ---
            *Auto-generated by E2E Smoke Tests workflow*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::E2E Smoke Tests failed. Review artifacts for details."
          exit 1

      - name: Success summary
        if: steps.tests.outcome == 'success'
        run: |
          echo "## E2E Smoke Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All smoke tests passed successfully." >> $GITHUB_STEP_SUMMARY
