<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="92" fill="url(#bg-gradient)"/>

  <!-- Seedling icon -->
  <g transform="translate(256, 256)" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stem -->
    <line x1="0" y1="-20" x2="0" y2="100"/>

    <!-- Left leaf -->
    <path d="M 0 -20 Q -80 -60 -90 -100 Q -50 -80 0 -40"/>

    <!-- Right leaf -->
    <path d="M 0 -40 Q 80 -80 90 -120 Q 50 -100 0 -60"/>

    <!-- Soil/ground arc -->
    <path d="M -60 100 Q 0 130 60 100"/>
  </g>
</svg>
