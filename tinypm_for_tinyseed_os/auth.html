<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TinyPM - Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  :root {
    --bg-primary: #0f1117;
    --bg-secondary: #1a1d27;
    --bg-card: #1e2130;
    --bg-hover: #252839;
    --bg-input: #141620;
    --border: #2a2d3e;
    --border-focus: #6366f1;
    --text-primary: #f0f0f5;
    --text-secondary: #a0a4b8;
    --text-muted: #6b6f82;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --accent-light: rgba(99, 102, 241, 0.15);
    --green: #22c55e;
    --red: #ef4444;
    --red-light: rgba(239, 68, 68, 0.15);
    --radius: 12px;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  .auth-container {
    width: 100%;
    max-width: 420px;
  }

  .auth-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 32px;
    box-shadow: var(--shadow);
  }

  .logo {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .logo h1 span {
    color: var(--accent);
  }

  .logo p {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 8px;
  }

  .auth-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 28px;
    background: var(--bg-input);
    border-radius: 10px;
    padding: 4px;
  }

  .auth-tab {
    flex: 1;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .auth-tab:hover {
    color: var(--text-primary);
  }

  .auth-tab.active {
    background: var(--accent);
    color: white;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 15px;
    transition: all 0.2s;
    outline: none;
  }

  .form-input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-light);
  }

  .form-input::placeholder {
    color: var(--text-muted);
  }

  .form-input.error {
    border-color: var(--red);
    box-shadow: 0 0 0 3px var(--red-light);
  }

  .password-wrapper {
    position: relative;
  }

  .password-toggle {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .password-toggle:hover {
    color: var(--text-secondary);
  }

  .btn {
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-oauth {
    background: var(--bg-input);
    color: var(--text-primary);
    border: 1px solid var(--border);
    margin-bottom: 12px;
  }

  .btn-oauth:hover {
    background: var(--bg-hover);
    border-color: var(--text-muted);
  }

  .btn-oauth svg {
    width: 20px;
    height: 20px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 24px 0;
    color: var(--text-muted);
    font-size: 13px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .forgot-link {
    display: block;
    text-align: right;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    margin-top: 8px;
    margin-bottom: -8px;
  }

  .forgot-link:hover {
    color: var(--accent-hover);
  }

  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    transform: translateX(120%);
    transition: transform 0.3s ease;
    z-index: 1000;
    max-width: 360px;
  }

  .toast.show {
    transform: translateX(0);
  }

  .toast.success {
    background: var(--green);
    color: white;
  }

  .toast.error {
    background: var(--red);
    color: white;
  }

  .toast-close {
    background: none;
    border: none;
    color: inherit;
    opacity: 0.8;
    cursor: pointer;
    padding: 2px;
    margin-left: auto;
  }

  .toast-close:hover {
    opacity: 1;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .hidden {
    display: none !important;
  }

  .form-error {
    color: var(--red);
    font-size: 12px;
    margin-top: 6px;
    display: none;
  }

  .form-error.show {
    display: block;
  }

  .terms {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 20px;
    line-height: 1.6;
  }

  .terms a {
    color: var(--text-secondary);
    text-decoration: none;
  }

  .terms a:hover {
    color: var(--accent);
  }

  /* Confirmation message */
  .confirmation-message {
    text-align: center;
    padding: 20px 0;
  }

  .confirmation-message svg {
    width: 60px;
    height: 60px;
    color: var(--green);
    margin-bottom: 16px;
  }

  .confirmation-message h2 {
    font-size: 20px;
    margin-bottom: 8px;
  }

  .confirmation-message p {
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.6;
  }

  @media (max-width: 480px) {
    .auth-card {
      padding: 32px 24px;
    }
  }
</style>
</head>
<body>
<div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <h1>Tiny<span>PM</span></h1>
      <p>Your intelligent project manager</p>
    </div>

    <!-- Auth Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="signin">Sign In</button>
      <button class="auth-tab" data-tab="signup">Sign Up</button>
    </div>

    <!-- Sign In Form -->
    <form id="signin-form">
      <!-- OAuth Buttons -->
      <button type="button" class="btn btn-oauth" id="google-signin">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <button type="button" class="btn btn-oauth" id="apple-signin">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
        Continue with Apple
      </button>

      <div class="divider">or continue with email</div>

      <div class="form-group">
        <label class="form-label" for="signin-email">Email</label>
        <input
          type="email"
          id="signin-email"
          class="form-input"
          placeholder="you@example.com"
          required
          autocomplete="email"
        />
        <p class="form-error" id="signin-email-error"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="signin-password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="signin-password"
            class="form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
          <button type="button" class="password-toggle" aria-label="Toggle password visibility">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <a href="#" class="forgot-link" id="forgot-password-link">Forgot password?</a>
        <p class="form-error" id="signin-password-error"></p>
      </div>

      <button type="submit" class="btn btn-primary" id="signin-btn">
        <span class="btn-text">Sign In</span>
        <div class="spinner hidden"></div>
      </button>
    </form>

    <!-- Sign Up Form -->
    <form id="signup-form" class="hidden">
      <!-- OAuth Buttons -->
      <button type="button" class="btn btn-oauth" id="google-signup">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign up with Google
      </button>

      <button type="button" class="btn btn-oauth" id="apple-signup">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
        Sign up with Apple
      </button>

      <div class="divider">or sign up with email</div>

      <div class="form-group">
        <label class="form-label" for="signup-name">Full Name</label>
        <input
          type="text"
          id="signup-name"
          class="form-input"
          placeholder="Your name"
          autocomplete="name"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-email">Email</label>
        <input
          type="email"
          id="signup-email"
          class="form-input"
          placeholder="you@example.com"
          required
          autocomplete="email"
        />
        <p class="form-error" id="signup-email-error"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="signup-password"
            class="form-input"
            placeholder="Create a password (min 8 characters)"
            required
            minlength="8"
            autocomplete="new-password"
          />
          <button type="button" class="password-toggle" aria-label="Toggle password visibility">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <p class="form-error" id="signup-password-error"></p>
      </div>

      <button type="submit" class="btn btn-primary" id="signup-btn">
        <span class="btn-text">Create Account</span>
        <div class="spinner hidden"></div>
      </button>

      <p class="terms">
        By signing up, you agree to our
        <a href="/terms">Terms of Service</a> and
        <a href="/privacy">Privacy Policy</a>
      </p>
    </form>

    <!-- Email Confirmation Message -->
    <div id="confirmation-view" class="confirmation-message hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <h2>Check your email</h2>
      <p>We've sent a confirmation link to <strong id="confirmation-email"></strong>. Click the link to verify your account.</p>
    </div>

    <!-- Forgot Password Form -->
    <form id="forgot-form" class="hidden">
      <div class="form-group">
        <label class="form-label" for="forgot-email">Email</label>
        <input
          type="email"
          id="forgot-email"
          class="form-input"
          placeholder="you@example.com"
          required
          autocomplete="email"
        />
        <p class="form-error" id="forgot-email-error"></p>
      </div>

      <button type="submit" class="btn btn-primary" id="forgot-btn">
        <span class="btn-text">Send Reset Link</span>
        <div class="spinner hidden"></div>
      </button>

      <p class="terms">
        <a href="#" id="back-to-signin">Back to sign in</a>
      </p>
    </form>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast">
  <span class="toast-message"></span>
  <button class="toast-close">&times;</button>
</div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/auth-guard.js"></script>
<script>
(async function() {
  // Initialize auth
  await tinypmAuth.init();

  // Check if already authenticated
  await authGuard.checkAuthPage();

  // DOM elements
  const signinForm = document.getElementById('signin-form');
  const signupForm = document.getElementById('signup-form');
  const forgotForm = document.getElementById('forgot-form');
  const confirmationView = document.getElementById('confirmation-view');
  const authTabs = document.querySelectorAll('.auth-tab');
  const toast = document.getElementById('toast');

  // Current view state
  let currentView = 'signin';

  // Show toast notification
  function showToast(message, type = 'error') {
    toast.querySelector('.toast-message').textContent = message;
    toast.className = `toast ${type} show`;
    setTimeout(() => toast.classList.remove('show'), 5000);
  }

  toast.querySelector('.toast-close').addEventListener('click', () => {
    toast.classList.remove('show');
  });

  // Switch tabs
  function switchTab(tab) {
    authTabs.forEach(t => t.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

    signinForm.classList.add('hidden');
    signupForm.classList.add('hidden');
    forgotForm.classList.add('hidden');
    confirmationView.classList.add('hidden');

    if (tab === 'signin') {
      signinForm.classList.remove('hidden');
    } else if (tab === 'signup') {
      signupForm.classList.remove('hidden');
    }

    currentView = tab;
  }

  authTabs.forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });

  // Show forgot password form
  document.getElementById('forgot-password-link').addEventListener('click', (e) => {
    e.preventDefault();
    signinForm.classList.add('hidden');
    forgotForm.classList.remove('hidden');
    document.querySelector('.auth-tabs').classList.add('hidden');
    currentView = 'forgot';
  });

  // Back to sign in
  document.getElementById('back-to-signin').addEventListener('click', (e) => {
    e.preventDefault();
    forgotForm.classList.add('hidden');
    signinForm.classList.remove('hidden');
    document.querySelector('.auth-tabs').classList.remove('hidden');
    currentView = 'signin';
  });

  // Password visibility toggle
  document.querySelectorAll('.password-toggle').forEach(toggle => {
    toggle.addEventListener('click', () => {
      const input = toggle.previousElementSibling;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      toggle.innerHTML = isPassword
        ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    });
  });

  // Set button loading state
  function setLoading(btn, loading) {
    const text = btn.querySelector('.btn-text');
    const spinner = btn.querySelector('.spinner');
    if (loading) {
      text.classList.add('hidden');
      spinner.classList.remove('hidden');
      btn.disabled = true;
    } else {
      text.classList.remove('hidden');
      spinner.classList.add('hidden');
      btn.disabled = false;
    }
  }

  // Clear form errors
  function clearErrors(form) {
    form.querySelectorAll('.form-input').forEach(input => input.classList.remove('error'));
    form.querySelectorAll('.form-error').forEach(error => error.classList.remove('show'));
  }

  // Show field error
  function showFieldError(inputId, message) {
    const input = document.getElementById(inputId);
    const error = document.getElementById(inputId + '-error');
    if (input) input.classList.add('error');
    if (error) {
      error.textContent = message;
      error.classList.add('show');
    }
  }

  // Sign In
  signinForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors(signinForm);

    const email = document.getElementById('signin-email').value.trim();
    const password = document.getElementById('signin-password').value;
    const btn = document.getElementById('signin-btn');

    if (!email) {
      showFieldError('signin-email', 'Email is required');
      return;
    }

    if (!password) {
      showFieldError('signin-password', 'Password is required');
      return;
    }

    setLoading(btn, true);

    const { user, error } = await tinypmAuth.signIn(email, password);

    setLoading(btn, false);

    if (error) {
      if (error.message.includes('Invalid login')) {
        showToast('Invalid email or password', 'error');
      } else if (error.message.includes('Email not confirmed')) {
        showToast('Please verify your email before signing in', 'error');
      } else {
        showToast(error.message, 'error');
      }
      return;
    }

    showToast('Welcome back!', 'success');

    // Redirect after successful login
    setTimeout(async () => {
      const { profile } = await tinypmAuth.getProfile();
      if (!profile || !profile.onboarding_completed) {
        window.location.href = '/onboarding';
      } else {
        const redirectTo = sessionStorage.getItem('tinypm_redirect_after_auth') || '/';
        sessionStorage.removeItem('tinypm_redirect_after_auth');
        window.location.href = redirectTo;
      }
    }, 500);
  });

  // Sign Up
  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors(signupForm);

    const name = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const btn = document.getElementById('signup-btn');

    if (!email) {
      showFieldError('signup-email', 'Email is required');
      return;
    }

    if (!password) {
      showFieldError('signup-password', 'Password is required');
      return;
    }

    if (password.length < 8) {
      showFieldError('signup-password', 'Password must be at least 8 characters');
      return;
    }

    setLoading(btn, true);

    const { user, session, error } = await tinypmAuth.signUp(email, password, { name });

    setLoading(btn, false);

    if (error) {
      if (error.message.includes('already registered')) {
        showFieldError('signup-email', 'This email is already registered');
      } else {
        showToast(error.message, 'error');
      }
      return;
    }

    // Check if email confirmation is required
    if (!session) {
      // Show confirmation message
      signupForm.classList.add('hidden');
      document.querySelector('.auth-tabs').classList.add('hidden');
      confirmationView.classList.remove('hidden');
      document.getElementById('confirmation-email').textContent = email;
    } else {
      // Immediate login (no email confirmation)
      showToast('Account created!', 'success');
      setTimeout(() => {
        window.location.href = '/onboarding';
      }, 500);
    }
  });

  // Forgot Password
  forgotForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors(forgotForm);

    const email = document.getElementById('forgot-email').value.trim();
    const btn = document.getElementById('forgot-btn');

    if (!email) {
      showFieldError('forgot-email', 'Email is required');
      return;
    }

    setLoading(btn, true);

    const { error } = await tinypmAuth.resetPassword(email);

    setLoading(btn, false);

    if (error) {
      showToast(error.message, 'error');
      return;
    }

    showToast('Password reset email sent!', 'success');
    setTimeout(() => {
      forgotForm.classList.add('hidden');
      signinForm.classList.remove('hidden');
      document.querySelector('.auth-tabs').classList.remove('hidden');
    }, 2000);
  });

  // Google OAuth
  document.getElementById('google-signin').addEventListener('click', async () => {
    const { error } = await tinypmAuth.signInWithGoogle();
    if (error) showToast(error.message, 'error');
  });

  document.getElementById('google-signup').addEventListener('click', async () => {
    const { error } = await tinypmAuth.signInWithGoogle();
    if (error) showToast(error.message, 'error');
  });

  // Apple OAuth
  document.getElementById('apple-signin').addEventListener('click', async () => {
    const { error } = await tinypmAuth.signInWithApple();
    if (error) showToast(error.message, 'error');
  });

  document.getElementById('apple-signup').addEventListener('click', async () => {
    const { error } = await tinypmAuth.signInWithApple();
    if (error) showToast(error.message, 'error');
  });

  // Check for OAuth error in URL
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('error')) {
    showToast('Authentication failed. Please try again.', 'error');
  }

})();
</script>
</body>
</html>
