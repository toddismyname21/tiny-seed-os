<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://maps.googleapis.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://maps.googleapis.com https://*.supabase.co; frame-src 'self' https://www.google.com;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#22c55e">
  <title>Tiny Seed Farm - Offline</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
  <style>
    :root {
      --primary: var(--ts-green-500, #22c55e);
      --primary-light: var(--ts-green-400, #4ade80);
      --bg-dark: var(--ts-bg-base, #0f172a);
      --bg-card: var(--ts-bg-surface, #1e293b);
      --bg-elevated: var(--ts-bg-elevated, #334155);
      --border: var(--ts-border, rgba(255, 255, 255, 0.1));
      --text-primary: var(--ts-text, #f8fafc);
      --text-secondary: var(--ts-text-secondary, #94a3b8);
      --text-muted: var(--ts-text-muted, #64748b);
      --success: var(--ts-green-500, #22c55e);
      --warning: var(--ts-amber-500, #f59e0b);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .offline-container {
      text-align: center;
      max-width: 400px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .offline-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 8px 32px rgba(45, 90, 39, 0.3);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .offline-icon svg {
      width: 60px;
      height: 60px;
      stroke: white;
      stroke-width: 1.5;
      fill: none;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .status-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
    }

    .status-row:not(:last-child) {
      border-bottom: 1px solid var(--border);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.pending {
      background: var(--warning);
      animation: blink 1.5s ease infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-dot.ready {
      background: var(--success);
    }

    .status-text {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .status-text strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      min-height: 56px;
      touch-action: manipulation;
    }

    .btn:hover {
      background: var(--primary-light);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 20px;
      height: 20px;
    }

    .btn.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .pending-actions {
      margin-top: 32px;
      text-align: left;
    }

    .pending-header {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .pending-item {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pending-item-icon {
      width: 40px;
      height: 40px;
      background: rgba(45, 90, 39, 0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pending-item-icon svg {
      width: 20px;
      height: 20px;
      stroke: var(--primary-light);
    }

    .pending-item-text {
      flex: 1;
      min-width: 0;
    }

    .pending-item-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pending-item-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .hidden {
      display: none !important;
    }

    /* Network status indicator */
    .network-status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }

    .network-status.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .network-status.online {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.3);
      color: var(--success);
    }

    /* Quick actions for offline mode */
    .quick-actions {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .quick-action {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .quick-action:hover {
      background: var(--bg-elevated);
      border-color: var(--primary);
    }

    .quick-action svg {
      width: 24px;
      height: 24px;
      stroke: var(--primary-light);
    }

    .quick-action span {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer img {
      width: 20px;
      height: 20px;
      vertical-align: middle;
      margin-right: 4px;
    }

    /* Spin animation */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spin { animation: spin 1s linear infinite; }

    /* Safe area for notched phones */
    @supports (padding: env(safe-area-inset-top)) {
      body {
        padding-top: calc(20px + env(safe-area-inset-top));
        padding-bottom: calc(20px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="network-status" id="networkStatus">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span>Back online!</span>
  </div>

  <div class="offline-container">
    <div class="offline-icon">
      <!-- Seed/Plant icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M12 22V12"/>
        <path d="M12 12c-3-3-4-7-4-7"/>
        <path d="M12 12c3-3 4-7 4-7"/>
        <path d="M12 8c2.5 0 4.5-1.5 4.5-1.5"/>
        <path d="M12 8c-2.5 0-4.5-1.5-4.5-1.5"/>
        <circle cx="12" cy="4" r="2"/>
        <path d="M9 20h6"/>
      </svg>
    </div>

    <h1>You're Offline</h1>
    <p class="subtitle">
      No worries! Your data is safely stored and will sync automatically when you reconnect.
    </p>

    <div class="status-card">
      <div class="status-row">
        <div class="status-dot pending"></div>
        <div class="status-text">
          <strong>Waiting for connection</strong>
        </div>
      </div>
      <div class="status-row">
        <div class="status-dot ready"></div>
        <div class="status-text">
          <strong id="pendingCount">0</strong> pending actions ready to sync
        </div>
      </div>
      <div class="status-row">
        <div class="status-dot ready"></div>
        <div class="status-text">
          Cached data available for viewing
        </div>
      </div>
    </div>

    <button class="btn" id="retryBtn" onclick="retryConnection()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6"/>
        <path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Try Again
    </button>

    <div class="quick-actions">
      <div class="quick-action" onclick="viewCachedData('tasks')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
        <span>View Tasks</span>
      </div>
      <div class="quick-action" onclick="viewCachedData('timeclock')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>Time Clock</span>
      </div>
      <div class="quick-action" onclick="viewCachedData('weather')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
        <span>Weather</span>
      </div>
      <div class="quick-action" onclick="viewCachedData('harvests')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 20h12"/>
          <path d="M6 16h12"/>
          <path d="M12 4l-4 4h8l-4-4z"/>
          <path d="M8 8v8"/>
          <path d="M16 8v8"/>
        </svg>
        <span>Harvests</span>
      </div>
    </div>

    <div class="pending-actions" id="pendingActions">
      <div class="pending-header">Pending Changes</div>
      <div id="pendingList">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

  <div class="footer">
    Tiny Seed Farm - Works Offline
  </div>

  <script>
    // Storage keys for offline data
    const STORAGE_KEYS = {
      offlineQueue: 'tinyseed_offline_queue',
      cachedTasks: 'tinyseed_cached_tasks',
      cachedTimeclock: 'tinyseed_cached_timeclock',
      cachedWeather: 'tinyseed_cached_weather',
      cachedHarvests: 'tinyseed_cached_harvests'
    };

    // Load pending actions from storage
    function loadPendingActions() {
      try {
        // Check IndexedDB first, then localStorage
        const queue = JSON.parse(localStorage.getItem(STORAGE_KEYS.offlineQueue) || '[]');
        const pendingList = document.getElementById('pendingList');
        const pendingCount = document.getElementById('pendingCount');
        const pendingActions = document.getElementById('pendingActions');

        pendingCount.textContent = queue.length;

        if (queue.length === 0) {
          pendingActions.classList.add('hidden');
          return;
        }

        pendingActions.classList.remove('hidden');
        pendingList.innerHTML = '';

        queue.slice(0, 5).forEach(action => {
          const item = document.createElement('div');
          item.className = 'pending-item';
          item.innerHTML = `
            <div class="pending-item-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
            </div>
            <div class="pending-item-text">
              <div class="pending-item-title">${escapeHtml(action.description || action.type || 'Pending action')}</div>
              <div class="pending-item-time">${formatTime(action.timestamp)}</div>
            </div>
          `;
          pendingList.appendChild(item);
        });

        if (queue.length > 5) {
          const more = document.createElement('div');
          more.className = 'pending-item';
          more.innerHTML = `
            <div class="pending-item-text">
              <div class="pending-item-title" style="color: var(--text-muted);">
                +${queue.length - 5} more actions pending
              </div>
            </div>
          `;
          pendingList.appendChild(more);
        }
      } catch (e) {
        console.error('Error loading pending actions:', e);
      }
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Format timestamp to relative time
    function formatTime(timestamp) {
      if (!timestamp) return 'Just now';
      const diff = Date.now() - timestamp;
      const minutes = Math.floor(diff / 60000);
      if (minutes < 1) return 'Just now';
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    // Retry connection
    function retryConnection() {
      const btn = document.getElementById('retryBtn');
      btn.classList.add('loading');
      btn.innerHTML = `
        <svg class="spin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="20"/>
        </svg>
        Checking...
      `;

      // Check connection
      fetch('/manifest.json', { cache: 'no-store' })
        .then(response => {
          if (response.ok) {
            showOnline();
            setTimeout(() => {
              window.location.href = '/employee.html';
            }, 1000);
          } else {
            throw new Error('Still offline');
          }
        })
        .catch(() => {
          btn.classList.remove('loading');
          btn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"/>
              <path d="M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
            Try Again
          `;
        });
    }

    // Show online status
    function showOnline() {
      const status = document.getElementById('networkStatus');
      status.classList.add('visible', 'online');
    }

    // View cached data
    function viewCachedData(type) {
      const storageKey = {
        'tasks': STORAGE_KEYS.cachedTasks,
        'timeclock': STORAGE_KEYS.cachedTimeclock,
        'weather': STORAGE_KEYS.cachedWeather,
        'harvests': STORAGE_KEYS.cachedHarvests
      }[type];

      if (!storageKey) return;

      try {
        const data = localStorage.getItem(storageKey);
        if (data) {
          // For now, just show an alert. In production, this would show a modal
          alert(`Cached ${type} data is available. Feature coming soon!`);
        } else {
          alert(`No cached ${type} data available.`);
        }
      } catch (e) {
        console.error('Error reading cached data:', e);
        alert('Unable to read cached data.');
      }
    }

    // Listen for online event
    window.addEventListener('online', () => {
      showOnline();
      setTimeout(() => {
        window.location.href = '/employee.html';
      }, 1500);
    });

    // Listen for service worker messages
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data?.type === 'SYNC_COMPLETE') {
          loadPendingActions();
        } else if (event.data?.type === 'SW_UPDATED') {
          // Reload page when SW updates
          window.location.reload();
        }
      });
    }

    // Initial load
    loadPendingActions();

    // Periodically check connection
    setInterval(() => {
      if (navigator.onLine) {
        fetch('/manifest.json', { cache: 'no-store' })
          .then(response => {
            if (response.ok) {
              showOnline();
              setTimeout(() => {
                window.location.href = '/employee.html';
              }, 1000);
            }
          })
          .catch(() => {});
      }
    }, 10000);

    // Register for background sync if available
    if ('serviceWorker' in navigator && 'SyncManager' in window) {
      navigator.serviceWorker.ready.then(registration => {
        registration.sync.register('sync-all').catch(err => {
          console.log('Background sync registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
