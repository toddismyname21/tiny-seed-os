<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://maps.googleapis.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://maps.googleapis.com https://*.supabase.co; frame-src 'self' https://www.google.com;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Sheets - Tiny Seed OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="web_app/auth-guard.js" data-required-role="Field_Lead"></script>
    <script src="web_app/print-engine.js"></script>
    <style>
        :root {
            --primary: var(--ts-green-500, #22c55e);
            --primary-light: var(--ts-green-400, #4ade80);
            --primary-dark: var(--ts-green-600, #16a34a);
            --secondary: #f4a261;
            --accent: #e76f51;
            --success: var(--ts-teal-500, #2a9d8f);
            --warning: var(--ts-amber-400, #e9c46a);
            --danger: var(--ts-red-500, #e63946);
            --bg-dark: var(--ts-bg-base, #1a1a2e);
            --bg-card: var(--ts-bg-surface, #16213e);
            --bg-light: var(--ts-bg-elevated, #0f3460);
            --text-primary: var(--ts-text, #edf2f4);
            --text-secondary: var(--ts-text-secondary, #8d99ae);
            --border: var(--ts-border, rgba(255,255,255,0.1));
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--ts-bg-subtle, #0f0f1a) 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-btn {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 15px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i { color: var(--primary-light); }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .sync-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-light);
            border-radius: 10px;
            font-size: 0.85rem;
        }

        .sync-indicator.connected { color: var(--success); }
        .sync-indicator.syncing { color: var(--warning); }
        .sync-indicator.error { color: var(--danger); }

        .main-container {
            padding: 100px 2rem 2rem;
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            .main-container { grid-template-columns: 1fr; }
        }

        /* Control Panel */
        .control-panel {
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .panel-section {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .panel-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .panel-title i { color: var(--primary-light); }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.2);
        }

        .date-range {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* Radio Buttons */
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--bg-light);
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-option:hover {
            border-color: var(--primary);
        }

        .radio-option.selected {
            background: rgba(45, 90, 39, 0.3);
            border-color: var(--primary-light);
        }

        .radio-option input[type="radio"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(45, 90, 39, 0.3);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-print {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
            color: white;
        }

        .btn-print:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(244, 162, 97, 0.3);
        }

        .btn-block { width: 100%; }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 1rem;
        }

        .stat-card {
            background: var(--bg-light);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-light);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Preview Area */
        .preview-area {
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 1.5rem;
            min-height: 600px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .preview-title {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .preview-title i { color: var(--primary-light); }

        /* Sheet Preview */
        .sheet-container {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            color: #1a1a1a;
            min-height: 500px;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .sheet-logo {
            width: 100px;
            height: auto;
        }

        .sheet-title-block {
            text-align: right;
        }

        .sheet-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .sheet-subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-top: 4px;
        }

        /* Summary Section */
        .summary-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .summary-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1rem;
        }

        .summary-box-title {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }

        .summary-item:last-child { border-bottom: none; }

        .summary-total {
            font-weight: 700;
            background: #e8f5e9;
            margin-top: 8px;
            padding: 8px;
            border-radius: 4px;
        }

        /* Task Table */
        .task-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .task-table th {
            background: var(--primary);
            color: white;
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .task-table th:first-child {
            border-radius: 6px 0 0 0;
            width: 40px;
            text-align: center;
        }

        .task-table th:last-child {
            border-radius: 0 6px 0 0;
        }

        .task-table td {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        .task-table tr:nth-child(even) {
            background: #f9f9f9;
        }

        .task-table tr:hover {
            background: #e8f5e9;
        }

        .task-table tr.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .task-checkbox {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .date-group-header {
            background: #e8f5e9 !important;
            font-weight: 700;
        }

        .date-group-header td {
            padding: 10px;
            color: var(--primary);
            font-size: 0.95rem;
        }

        /* Germination Notes */
        .germ-notes {
            background: #fff8e1;
            border: 1px solid #ffcc80;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1.5rem;
        }

        .germ-notes-title {
            font-weight: 700;
            color: #e65100;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .germ-note-item {
            font-size: 0.85rem;
            padding: 6px 0;
            border-bottom: 1px solid #ffe0b2;
        }

        .germ-note-item:last-child { border-bottom: none; }

        .germ-crop {
            font-weight: 600;
            color: #333;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #999;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: #666;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
        }

        .loading i {
            font-size: 2rem;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.warning { border-left: 4px solid var(--warning); }

        /* Category Badges */
        .category-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .category-badge.veg { background: #c8e6c9; color: #2e7d32; }
        .category-badge.herb { background: #b2dfdb; color: #00695c; }
        .category-badge.floral { background: #f8bbd9; color: #ad1457; }

        /* Print Checkbox (for print view) */
        .print-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #333;
            border-radius: 3px;
            display: inline-block;
        }

        /* Dirty cell / inline editing styles */
        .dirty-cell {
            background: rgba(249, 158, 11, 0.2) !important;
            border-radius: 4px;
        }
        .editable-cell:hover {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </a>
            <h1 class="page-title">
                <i class="fas fa-clipboard-list"></i>
                Printable Task Sheets
            </h1>
        </div>
        <div class="header-actions">
            <div class="sync-indicator connected" id="syncIndicator">
                <i class="fas fa-circle"></i>
                <span>Connected</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Control Panel -->
        <div class="control-panel">
            <!-- Task Type -->
            <div class="panel-section">
                <h3 class="panel-title">
                    <i class="fas fa-tasks"></i>
                    Task Type
                </h3>
                <div class="radio-group">
                    <label class="radio-option selected" onclick="selectTaskType(this, 'ghSow')">
                        <input type="radio" name="taskType" value="ghSow" checked>
                        <i class="fas fa-seedling" style="color: #4ade80;"></i>
                        <span>Greenhouse Sowing</span>
                    </label>
                    <label class="radio-option" onclick="selectTaskType(this, 'transplant')">
                        <input type="radio" name="taskType" value="transplant">
                        <i class="fas fa-exchange-alt" style="color: #2a9d8f;"></i>
                        <span>Transplanting</span>
                    </label>
                    <label class="radio-option" onclick="selectTaskType(this, 'directSeed')">
                        <input type="radio" name="taskType" value="directSeed">
                        <i class="fas fa-tractor" style="color: #e9c46a;"></i>
                        <span>Direct Seeding</span>
                    </label>
                </div>
            </div>

            <!-- Date Range -->
            <div class="panel-section">
                <h3 class="panel-title">
                    <i class="fas fa-calendar-alt"></i>
                    Date Range
                </h3>
                <div class="date-range">
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" class="form-control" id="startDate">
                    </div>
                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" class="form-control" id="endDate">
                    </div>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 0.5rem;">
                    <button class="btn btn-secondary" style="flex:1; padding: 8px;" onclick="setThisWeek()">This Week</button>
                    <button class="btn btn-secondary" style="flex:1; padding: 8px;" onclick="setNextWeek()">Next Week</button>
                </div>
                <button class="btn" style="width:100%; margin-top: 8px; padding: 8px; background: var(--danger); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;" onclick="loadOverdueTasks()">
                    <i class="fas fa-exclamation-triangle"></i> Load Overdue Tasks
                </button>
            </div>

            <!-- Category Filter -->
            <div class="panel-section">
                <h3 class="panel-title">
                    <i class="fas fa-filter"></i>
                    Category
                </h3>
                <div class="radio-group">
                    <label class="radio-option selected" onclick="selectCategory(this, 'all')">
                        <input type="radio" name="category" value="all" checked>
                        <span>All Crops</span>
                    </label>
                    <label class="radio-option" onclick="selectCategory(this, 'veg-herb')">
                        <input type="radio" name="category" value="veg-herb">
                        <span>Vegetables & Herbs</span>
                    </label>
                    <label class="radio-option" onclick="selectCategory(this, 'floral')">
                        <input type="radio" name="category" value="floral">
                        <span>Florals</span>
                    </label>
                </div>
            </div>

            <!-- Sort Order -->
            <div class="panel-section">
                <h3 class="panel-title">
                    <i class="fas fa-sort"></i>
                    Sort By
                </h3>
                <div class="radio-group">
                    <label class="radio-option selected" onclick="selectSort(this, 'date')">
                        <input type="radio" name="sortBy" value="date" checked>
                        <span>Date</span>
                    </label>
                    <label class="radio-option" onclick="selectSort(this, 'crop')">
                        <input type="radio" name="sortBy" value="crop">
                        <span>Crop</span>
                    </label>
                </div>
            </div>

            <!-- Load Button -->
            <div class="panel-section">
                <button class="btn btn-primary btn-block" onclick="loadTasks()">
                    <i class="fas fa-download"></i>
                    Load Tasks
                </button>
            </div>

            <!-- Statistics -->
            <div class="panel-section">
                <h3 class="panel-title">
                    <i class="fas fa-chart-bar"></i>
                    Summary
                </h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="statTotalTasks">0</div>
                        <div class="stat-label">Tasks</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statTotalTrays">0</div>
                        <div class="stat-label">Trays</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statTotalSeeds">0</div>
                        <div class="stat-label">Seeds</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statCompleted">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                </div>
            </div>

            <!-- Print Button -->
            <div class="panel-section">
                <button class="btn btn-print btn-block" onclick="printSheet()" id="printBtn" disabled>
                    <i class="fas fa-print"></i>
                    Print Task Sheet
                </button>
            </div>
        </div>

        <!-- Preview Area -->
        <div class="preview-area">
            <div class="preview-header">
                <h2 class="preview-title">
                    <i class="fas fa-file-alt"></i>
                    Task Sheet Preview
                </h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary" onclick="saveProgress()" id="saveBtn" disabled>
                        <i class="fas fa-save"></i>
                        Save Progress
                    </button>
                </div>
            </div>

            <!-- Sheet Content -->
            <div class="sheet-container" id="sheetContainer">
                <div class="empty-state">
                    <i class="fas fa-seedling"></i>
                    <h3>No Tasks Loaded</h3>
                    <p>Select a date range and click "Load Tasks" to generate a sowing sheet.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success</span>
    </div>

    <script src="web_app/api-config.js"></script>
    <script>
        // Configuration
        const API_URL = TINY_SEED_API.MAIN_API;

        // Farm Logo (base64 or URL)
        const FARM_LOGO = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgODAiPjx0ZXh0IHg9IjEwIiB5PSI1MCIgZm9udC1mYW1pbHk9IkludGVyLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjI0IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMmQ1YTI3Ij5UaW55IFNlZWQgRmFybTwvdGV4dD48L3N2Zz4=';

        // State
        let tasks = [];
        let summary = {};
        let currentCategory = 'all';
        let currentSort = 'date';
        let currentTaskType = 'ghSow';

        // Task Type Configuration
        const taskTypeConfig = {
            ghSow: {
                title: 'GREENHOUSE SOWING TASKS',
                icon: 'fa-seedling',
                dateField: 'sowDate',  // API returns 'sowDate' for all task types
                apiAction: 'getGreenhouseSowingTasks',
                columns: ['Date', 'Crop', 'Variety', 'Trays', 'Cells', 'Seeds', 'Notes']
            },
            transplant: {
                title: 'TRANSPLANTING TASKS',
                icon: 'fa-exchange-alt',
                dateField: 'sowDate',  // Will need transplant-specific API
                apiAction: 'getTransplantTasks',
                columns: ['Date', 'Crop', 'Variety', 'Plants', 'Location', 'From']
            },
            directSeed: {
                title: 'DIRECT SEEDING TASKS',
                icon: 'fa-tractor',
                dateField: 'sowDate',  // API uses 'sowDate' for direct seed too
                apiAction: 'getDirectSeedTasks',
                columns: ['Date', 'Crop', 'Variety', 'Feet', 'Seeds', 'Location']
            }
        };

        // Helper to get date from task (handles multiple field names)
        function getTaskDate(task) {
            return task.plannedDate || task.sowDate || task.ghSowDate || task.transplantDate || task.fieldSowDate || '';
        }

        // Initialize — supports URL params for auto-loading (2E)
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);

            // Auto-set task type from URL
            const taskTypeParam = urlParams.get('taskType');
            if (taskTypeParam && taskTypeConfig[taskTypeParam]) {
                currentTaskType = taskTypeParam;
                // Update radio buttons
                document.querySelectorAll('[name="taskType"]').forEach(radio => {
                    const opt = radio.closest('.radio-option');
                    if (opt) opt.classList.remove('selected');
                    if (radio.value === taskTypeParam) {
                        radio.checked = true;
                        const opt2 = radio.closest('.radio-option');
                        if (opt2) opt2.classList.add('selected');
                    }
                });
            }

            // Auto-set dates from URL
            const startParam = urlParams.get('startDate');
            const endParam = urlParams.get('endDate');
            if (startParam) document.getElementById('startDate').value = startParam;
            if (endParam) document.getElementById('endDate').value = endParam;

            // Default: set this week if no URL params
            if (!startParam && !endParam) {
                setThisWeek();
            }

            // Auto-load if requested (for dashboard linking)
            const filterParam = urlParams.get('filter');
            if (filterParam === 'overdue') {
                loadOverdueTasks();
            } else if (urlParams.get('autoLoad') === 'true') {
                loadTasks();
            }
        });

        // Date Range Helpers
        function setThisWeek() {
            const today = new Date();
            const monday = new Date(today);
            monday.setDate(today.getDate() - today.getDay() + 1);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            document.getElementById('startDate').value = formatDateForInput(monday);
            document.getElementById('endDate').value = formatDateForInput(sunday);
        }

        function setNextWeek() {
            const today = new Date();
            const nextMonday = new Date(today);
            nextMonday.setDate(today.getDate() - today.getDay() + 8);
            const nextSunday = new Date(nextMonday);
            nextSunday.setDate(nextMonday.getDate() + 6);

            document.getElementById('startDate').value = formatDateForInput(nextMonday);
            document.getElementById('endDate').value = formatDateForInput(nextSunday);
        }

        function formatDateForInput(date) {
            return date.toISOString().split('T')[0];
        }

        function formatDateDisplay(dateStr) {
            if (!dateStr) return '--';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return '--';
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function formatDateShort(dateStr) {
            if (!dateStr) return '--';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return '--';
            return date.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' });
        }

        // Category Selection
        function selectCategory(element, value) {
            document.querySelectorAll('.radio-group .radio-option').forEach(opt => {
                if (opt.parentElement === element.parentElement) {
                    opt.classList.remove('selected');
                }
            });
            element.classList.add('selected');
            element.querySelector('input').checked = true;
            currentCategory = value;
        }

        // Sort Selection
        function selectSort(element, value) {
            document.querySelectorAll('[name="sortBy"]').forEach(radio => {
                radio.closest('.radio-option').classList.remove('selected');
            });
            element.classList.add('selected');
            element.querySelector('input').checked = true;
            currentSort = value;
            if (tasks.length > 0) {
                renderSheet();
            }
        }

        // Task Type Selection
        function selectTaskType(element, value) {
            document.querySelectorAll('[name="taskType"]').forEach(radio => {
                radio.closest('.radio-option').classList.remove('selected');
            });
            element.classList.add('selected');
            element.querySelector('input').checked = true;
            currentTaskType = value;
            // Clear current tasks when switching types
            tasks = [];
            summary = {};
            document.getElementById('sheetContainer').innerHTML = `
                <div class="empty-state">
                    <i class="fas ${taskTypeConfig[value].icon}"></i>
                    <h3>No Tasks Loaded</h3>
                    <p>Select a date range and click "Load Tasks" to generate a ${taskTypeConfig[value].title.toLowerCase().replace(' tasks', '')} sheet.</p>
                </div>
            `;
            document.getElementById('printBtn').disabled = true;
            document.getElementById('saveBtn').disabled = true;
            updateStats();
        }

        // Load Tasks from API
        async function loadTasks() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) {
                showToast('Please select a date range', 'error');
                return;
            }

            showLoading();

            const config = taskTypeConfig[currentTaskType];

            try {
                const url = `${API_URL}?action=${config.apiAction}&startDate=${startDate}&endDate=${endDate}&category=${currentCategory}`;
                const response = await fetch(url, {
                    method: 'GET',
                    redirect: 'follow',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                const data = await response.json();

                if (data.success && data.tasks) {
                    tasks = data.tasks || [];
                    summary = data.summary || {};
                    renderSheet();
                    updateStats();
                    document.getElementById('printBtn').disabled = tasks.length === 0;
                    document.getElementById('saveBtn').disabled = tasks.length === 0;
                    showToast(`Loaded ${tasks.length} ${currentTaskType === 'ghSow' ? 'sowing' : currentTaskType === 'transplant' ? 'transplant' : 'direct seed'} tasks`, 'success');
                } else {
                    showErrorState(data.error || 'No tasks returned from server');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                showErrorState('Could not load tasks. Check your connection and try again.');
            }
        }

        // Show error instead of demo data (CLAUDE.md: NEVER add demo data fallbacks)
        function showErrorState(message) {
            document.getElementById('sheetContainer').innerHTML = `
                <div class="empty-state" style="border: 2px solid var(--danger); border-radius: 12px; padding: 2rem;">
                    <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i>
                    <h3 style="color: var(--danger);">Error Loading Tasks</h3>
                    <p>${message}</p>
                    <button class="btn btn-primary" onclick="loadTasks()" style="margin-top: 1rem;">
                        <i class="fas fa-redo"></i> Try Again
                    </button>
                </div>
            `;
            document.getElementById('printBtn').disabled = true;
            document.getElementById('saveBtn').disabled = true;
        }

        // Load overdue tasks
        async function loadOverdueTasks() {
            showLoading();
            try {
                const url = `${API_URL}?action=getOverduePlantings`;
                const response = await fetch(url, { method: 'GET', redirect: 'follow', headers: { 'Accept': 'application/json' } });
                const data = await response.json();

                if (data.success) {
                    // Filter by current task type (backend returns type as 'ghSow', 'transplant', 'directSeed')
                    const filtered = (data.tasks || []).filter(t => t.type === currentTaskType);

                    // Normalize to our task format
                    tasks = filtered.map(t => ({
                        batchId: t.batchId || t.batch_id || '',
                        crop: t.crop || '',
                        variety: t.variety || '',
                        category: t.category || 'Veg',
                        sowDate: t.plannedDate || t.dueDate || '',
                        plannedDate: t.plannedDate || t.dueDate || '',
                        actualDate: null,
                        daysVariance: null,
                        trays: t.trays || t.traysNeeded || 0,
                        cellsPerTray: t.cellsPerTray || t.cellCount || 0,
                        plantsNeeded: t.plantsNeeded || 0,
                        seedsNeeded: t.seedsNeeded || 0,
                        bed: t.bed || t.targetBed || t.location || '',
                        germTemp: t.germTemp || '',
                        notes: t.notes || '',
                        completed: false,
                        daysOverdue: t.daysOverdue || 0,
                        location: t.location || t.bed || t.targetBed || '',
                        readiness: t.readiness || { hasTrays: (t.trays || 0) > 0, hasCellSize: (t.cellsPerTray || 0) > 0, hasBed: !!(t.bed || t.targetBed || t.location), hasSeedLot: false, hasPlants: (t.plantsNeeded || 0) > 0 }
                    }));

                    // Use backend summary if available, otherwise compute locally
                    var backendSummary = data.summary || {};
                    summary = {
                        totalTasks: tasks.length,
                        totalTrays: backendSummary.totalTrays || tasks.reduce((sum, t) => sum + (t.trays || 0), 0),
                        traysBySize: backendSummary.traysBySize || {},
                        seedsNeeded: [],
                        readinessIssues: backendSummary.readinessIssues || null
                    };
                    renderSheet();
                    updateStats();
                    document.getElementById('printBtn').disabled = tasks.length === 0;
                    document.getElementById('saveBtn').disabled = tasks.length === 0;
                    showToast(`Loaded ${tasks.length} overdue ${currentTaskType === 'ghSow' ? 'sowing' : currentTaskType} tasks`, tasks.length > 0 ? 'warning' : 'success');
                } else {
                    showErrorState(data.error || 'Could not load overdue tasks');
                }
            } catch (error) {
                console.error('Overdue fetch error:', error);
                showErrorState('Could not load overdue tasks. Check your connection.');
            }
        }

        // Dirty state tracking for inline editing
        let dirtyFields = {}; // { batchId: { fieldName: newValue, ... } }

        function markFieldDirty(batchId, field, value) {
            if (!dirtyFields[batchId]) dirtyFields[batchId] = {};
            dirtyFields[batchId][field] = value;
            updateSaveBar();
        }

        function updateSaveBar() {
            const count = Object.keys(dirtyFields).length;
            let bar = document.getElementById('dirtySaveBar');
            if (count > 0) {
                if (!bar) {
                    bar = document.createElement('div');
                    bar.id = 'dirtySaveBar';
                    bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:var(--warning);color:#1a1a2e;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;z-index:9999;font-weight:600;';
                    document.body.appendChild(bar);
                }
                bar.innerHTML = `<span><i class="fas fa-edit"></i> ${count} task(s) with unsaved changes</span><button class="btn btn-primary" onclick="saveFieldEdits()" style="padding:8px 20px;"><i class="fas fa-save"></i> Save Changes</button>`;
            } else if (bar) {
                bar.remove();
            }
        }

        async function saveFieldEdits() {
            const batches = Object.keys(dirtyFields);
            if (batches.length === 0) return;

            showToast('Saving edits...', 'warning');
            let saved = 0;
            let errors = [];

            for (const batchId of batches) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'updatePlanningFields', batchId: batchId, fields: dirtyFields[batchId] })
                    });
                    const result = await response.json();
                    if (result.success) {
                        saved++;
                        // Update local task data
                        const task = tasks.find(t => t.batchId === batchId);
                        if (task) {
                            Object.assign(task, dirtyFields[batchId]);
                        }
                    } else {
                        errors.push(batchId + ': ' + (result.error || 'Unknown error'));
                    }
                } catch (e) {
                    errors.push(batchId + ': ' + e.message);
                }
            }

            dirtyFields = {};
            updateSaveBar();

            if (errors.length > 0) {
                showToast(`Saved ${saved}, failed ${errors.length}: ${errors[0]}`, 'error');
            } else {
                showToast(`Saved ${saved} task(s) successfully`, 'success');
                // Remove dirty styling
                document.querySelectorAll('.dirty-cell').forEach(el => el.classList.remove('dirty-cell'));
            }
        }

        // Update Statistics
        function updateStats() {
            document.getElementById('statTotalTasks').textContent = tasks.length;
            document.getElementById('statTotalTrays').textContent = summary.totalTrays || tasks.reduce((sum, t) => sum + (t.trays || 0), 0);
            document.getElementById('statTotalSeeds').textContent = (summary.seedsNeeded || []).reduce((sum, s) => sum + (s.totalSeeds || s.seeds || 0), 0).toLocaleString();
            document.getElementById('statCompleted').textContent = tasks.filter(t => t.completed).length;
        }

        // Show Loading State
        function showLoading() {
            document.getElementById('sheetContainer').innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p style="margin-top: 1rem; color: #666;">Loading tasks...</p>
                </div>
            `;
        }

        // Render Sheet
        function renderSheet() {
            const config = taskTypeConfig[currentTaskType];

            if (tasks.length === 0) {
                document.getElementById('sheetContainer').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-calendar-times"></i>
                        <h3>No Tasks Found</h3>
                        <p>No ${config.title.toLowerCase()} found for the selected date range.</p>
                    </div>
                `;
                return;
            }

            // Sort tasks by appropriate date field
            let sortedTasks = [...tasks];
            const dateField = config.dateField;
            if (currentSort === 'date') {
                sortedTasks.sort((a, b) => new Date(a[dateField]) - new Date(b[dateField]) || a.crop.localeCompare(b.crop));
            } else {
                sortedTasks.sort((a, b) => a.crop.localeCompare(b.crop) || new Date(a[dateField]) - new Date(b[dateField]));
            }

            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            let html = `
                <div class="sheet-header">
                    <img src="${FARM_LOGO}" alt="Tiny Seed Farm" class="sheet-logo">
                    <div class="sheet-title-block">
                        <div class="sheet-title">${config.title}</div>
                        <div class="sheet-subtitle">${formatDateDisplay(startDate)} - ${formatDateDisplay(endDate)}</div>
                    </div>
                </div>

                ${renderSummarySection()}

                <table class="task-table">
                    <thead>
                        <tr>
                            <th><i class="fas fa-check"></i></th>
                            ${config.columns.map(col => `<th>${col}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
            `;

            // Group by date or crop
            if (currentSort === 'date') {
                let currentDate = '';
                sortedTasks.forEach(task => {
                    const taskDate = task[dateField];
                    if (taskDate !== currentDate) {
                        currentDate = taskDate;
                        html += `
                            <tr class="date-group-header">
                                <td colspan="${config.columns.length + 1}"><i class="fas fa-calendar-day"></i> ${formatDateDisplay(currentDate)}</td>
                            </tr>
                        `;
                    }
                    html += renderTaskRow(task);
                });
            } else {
                let currentCrop = '';
                sortedTasks.forEach(task => {
                    if (task.crop !== currentCrop) {
                        currentCrop = task.crop;
                        html += `
                            <tr class="date-group-header">
                                <td colspan="${config.columns.length + 1}"><i class="fas fa-leaf"></i> ${currentCrop}</td>
                            </tr>
                        `;
                    }
                    html += renderTaskRow(task);
                });
            }

            html += `
                    </tbody>
                </table>
            `;

            // Germination Notes (only for GH Sowing)
            if (currentTaskType === 'ghSow') {
                const uniqueGermNotes = [...new Map(tasks.filter(t => t.germInstructions).map(t => [t.crop, t])).values()];
                if (uniqueGermNotes.length > 0) {
                    html += `
                        <div class="germ-notes">
                            <div class="germ-notes-title">
                                <i class="fas fa-temperature-high"></i>
                                Germination Notes
                            </div>
                            ${uniqueGermNotes.map(t => `
                                <div class="germ-note-item">
                                    <span class="germ-crop">${t.crop}:</span> ${t.germTemp ? `${t.germTemp} - ` : ''}${t.germInstructions}
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            }

            document.getElementById('sheetContainer').innerHTML = html;
        }

        // Render Summary Section based on task type
        function renderSummarySection() {
            if (currentTaskType === 'ghSow') {
                return `
                    <div class="summary-section">
                        <div class="summary-box">
                            <div class="summary-box-title">Tray Counts</div>
                            ${Object.entries(summary.traysBySize || {}).map(([size, count]) => `
                                <div class="summary-item">
                                    <span>${size}-cell trays</span>
                                    <span>${count}</span>
                                </div>
                            `).join('')}
                            <div class="summary-item summary-total">
                                <span>TOTAL TRAYS</span>
                                <span>${summary.totalTrays || 0}</span>
                            </div>
                        </div>
                        <div class="summary-box">
                            <div class="summary-box-title">Seeds Needed</div>
                            ${(summary.seedsNeeded || []).slice(0, 6).map(s => `
                                <div class="summary-item">
                                    <span>${s.crop} (${(s.variety || '').substring(0, 15)}${(s.variety || '').length > 15 ? '...' : ''})</span>
                                    <span>${(s.totalSeeds || s.seeds || 0).toLocaleString()}</span>
                                </div>
                            `).join('')}
                            ${(summary.seedsNeeded || []).length === 0 ? '<div class="summary-item" style="opacity:0.6;"><span>No seed data</span><span>--</span></div>' : ''}
                        </div>
                        ${summary.readinessIssues ? `
                        <div class="summary-box" style="border-left: 3px solid var(--danger);">
                            <div class="summary-box-title" style="color: var(--danger);"><i class="fas fa-exclamation-triangle"></i> Readiness Issues</div>
                            ${summary.readinessIssues.missingTrays > 0 ? `<div class="summary-item"><span>Missing Tray Count</span><span style="color:var(--danger);">${summary.readinessIssues.missingTrays}</span></div>` : ''}
                            ${summary.readinessIssues.missingCellSize > 0 ? `<div class="summary-item"><span>Missing Cell Size</span><span style="color:var(--danger);">${summary.readinessIssues.missingCellSize}</span></div>` : ''}
                            ${summary.readinessIssues.missingBed > 0 ? `<div class="summary-item"><span>Missing Target Bed</span><span style="color:var(--warning);">${summary.readinessIssues.missingBed}</span></div>` : ''}
                            ${summary.readinessIssues.missingSeedLot > 0 ? `<div class="summary-item"><span>No Seed Lot Linked</span><span style="color:var(--warning);">${summary.readinessIssues.missingSeedLot}</span></div>` : ''}
                            ${Object.values(summary.readinessIssues).every(v => v === 0) ? '<div class="summary-item" style="color:var(--success);"><span>All tasks ready!</span><span><i class="fas fa-check-circle"></i></span></div>' : ''}
                        </div>
                        ` : ''}
                    </div>
                `;
            } else if (currentTaskType === 'transplant') {
                return `
                    <div class="summary-section">
                        <div class="summary-box">
                            <div class="summary-box-title">Plants by Location</div>
                            ${Object.entries(summary.byLocation || {}).map(([loc, count]) => `
                                <div class="summary-item">
                                    <span>${loc}</span>
                                    <span>${count.toLocaleString()}</span>
                                </div>
                            `).join('')}
                            <div class="summary-item summary-total">
                                <span>TOTAL PLANTS</span>
                                <span>${summary.totalPlants || tasks.reduce((sum, t) => sum + (t.plants || 0), 0)}</span>
                            </div>
                        </div>
                        <div class="summary-box">
                            <div class="summary-box-title">Task Overview</div>
                            <div class="summary-item">
                                <span>Total Tasks</span>
                                <span>${tasks.length}</span>
                            </div>
                            <div class="summary-item">
                                <span>Unique Crops</span>
                                <span>${summary.uniqueCrops || [...new Set(tasks.map(t => t.crop))].length}</span>
                            </div>
                            <div class="summary-item">
                                <span>Completed</span>
                                <span>${tasks.filter(t => t.completed).length}</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTaskType === 'directSeed') {
                return `
                    <div class="summary-section">
                        <div class="summary-box">
                            <div class="summary-box-title">Bed Feet Summary</div>
                            <div class="summary-item summary-total">
                                <span>TOTAL BED FEET</span>
                                <span>${summary.totalFeet || tasks.reduce((sum, t) => sum + (t.feet || 0), 0)}</span>
                            </div>
                            <div class="summary-item">
                                <span>Total Seeds</span>
                                <span>${(summary.totalSeeds || tasks.reduce((sum, t) => sum + (t.seedsNeeded || 0), 0)).toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="summary-box">
                            <div class="summary-box-title">Task Overview</div>
                            <div class="summary-item">
                                <span>Total Tasks</span>
                                <span>${tasks.length}</span>
                            </div>
                            <div class="summary-item">
                                <span>Unique Crops</span>
                                <span>${summary.uniqueCrops || [...new Set(tasks.map(t => t.crop))].length}</span>
                            </div>
                            <div class="summary-item">
                                <span>Completed</span>
                                <span>${tasks.filter(t => t.completed).length}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            return '';
        }

        function renderTaskRow(task) {
            const categoryClass = task.category === 'Floral' ? 'floral' : (task.category === 'Herb' ? 'herb' : 'veg');
            const config = taskTypeConfig[currentTaskType];
            const taskDate = task.plannedDate || task[config.dateField];

            // Planned vs Actual date display
            let dateCell = formatDateShort(taskDate);
            if (task.actualDate) {
                const variance = task.daysVariance || 0;
                let varColor = '#22c55e'; // green = on time
                let varLabel = 'on time';
                if (variance > 0) {
                    varColor = variance <= 3 ? '#f59e0b' : '#e63946'; // yellow or red
                    varLabel = '+' + variance + 'd late';
                } else if (variance < 0) {
                    varColor = '#3b82f6'; // blue = early
                    varLabel = Math.abs(variance) + 'd early';
                }
                dateCell = `${formatDateShort(taskDate)}<br><span style="font-size:10px;color:${varColor};font-weight:600;">Actual: ${formatDateShort(task.actualDate)} (${varLabel})</span>`;
            }

            // Readiness flags
            let readinessHtml = '';
            if (!task.completed && task.readiness) {
                const issues = [];
                if (!task.readiness.hasTrays) issues.push('trays');
                if (!task.readiness.hasCellSize) issues.push('cell size');
                if (!task.readiness.hasBed) issues.push('bed');
                if (issues.length > 0) {
                    readinessHtml = `<span style="color:var(--danger);font-size:10px;cursor:help;" title="Needs: ${issues.join(', ')}"><i class="fas fa-exclamation-triangle"></i></span>`;
                }
            }

            // Auto-calculated indicator
            let traysDisplay = task.trays || 0;
            if (task.autoCalculatedTrays) {
                traysDisplay = `${task.trays} <span style="font-size:9px;color:var(--warning);cursor:help;" title="Auto-calculated from plants/cells — verify">calc</span>`;
            }

            // Editable cell helper
            function editableCell(field, value, type) {
                type = type || 'text';
                const bid = task.batchId;
                return `<span class="editable-cell" onclick="makeEditable(this, '${bid}', '${field}', '${type}')" style="cursor:pointer;border-bottom:1px dashed rgba(255,255,255,0.3);padding:2px 4px;">${value || '-'}</span>`;
            }

            let rowContent = '';

            if (currentTaskType === 'ghSow') {
                rowContent = `
                    <td>${dateCell}</td>
                    <td>${task.crop} <span class="category-badge ${categoryClass}">GH</span> ${readinessHtml}</td>
                    <td>${task.variety}</td>
                    <td>${editableCell('Trays_Needed', traysDisplay, 'number')}</td>
                    <td>${editableCell('Tray_Cell_Count', task.cellsPerTray || '-', 'number')}</td>
                    <td style="font-weight:600;color:#f59e0b;">${task.seedsNeeded > 0 ? task.seedsNeeded : (task.trays > 0 && task.cellsPerTray > 0 ? Math.ceil(task.trays * task.cellsPerTray * 1.05) : '-')}</td>
                    <td>${editableCell('Notes', task.notes || '', 'text')}</td>
                `;
            } else if (currentTaskType === 'transplant') {
                rowContent = `
                    <td>${dateCell}</td>
                    <td>${task.crop} <span class="category-badge ${categoryClass}">TP</span> ${readinessHtml}</td>
                    <td>${task.variety}</td>
                    <td><strong>${task.plantsNeeded || task.plants || 0}</strong></td>
                    <td>${editableCell('Target_Bed_ID', task.bed || task.location || '-', 'text')}</td>
                    <td>${task.fromTray || '-'}</td>
                `;
            } else if (currentTaskType === 'directSeed') {
                rowContent = `
                    <td>${dateCell}</td>
                    <td>${task.crop} <span class="category-badge ${categoryClass}">DS</span> ${readinessHtml}</td>
                    <td>${task.variety}</td>
                    <td><strong>${editableCell('Feet_Used', (task.feetUsed || task.feet || 0) + ' ft', 'number')}</strong></td>
                    <td>${(task.seedsNeeded || 0).toLocaleString()}</td>
                    <td>${editableCell('Target_Bed_ID', task.bed || task.location || '-', 'text')}</td>
                `;
            }

            return `
                <tr class="${task.completed ? 'completed' : ''}" data-batch-id="${task.batchId}">
                    <td style="text-align: center;">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${task.batchId}', this.checked)">
                    </td>
                    ${rowContent}
                </tr>
            `;
        }

        // Inline editing: click to edit a cell
        function makeEditable(element, batchId, fieldName, inputType) {
            if (element.querySelector('input')) return; // Already editing
            const currentValue = element.textContent.trim().replace(' ft', '').replace('calc', '').trim();
            const input = document.createElement('input');
            input.type = inputType || 'text';
            input.value = currentValue === '-' ? '' : currentValue;
            input.style.cssText = 'width:80px;padding:4px;border:1px solid var(--primary);border-radius:4px;background:var(--bg-light);color:var(--text-primary);font-size:13px;';
            input.onblur = function() {
                const newValue = input.value.trim();
                if (newValue !== currentValue && newValue !== '') {
                    element.textContent = newValue;
                    element.classList.add('dirty-cell');
                    element.style.background = 'rgba(249, 158, 11, 0.2)';
                    markFieldDirty(batchId, fieldName, inputType === 'number' ? Number(newValue) : newValue);
                } else {
                    element.textContent = currentValue || '-';
                }
            };
            input.onkeydown = function(e) {
                if (e.key === 'Enter') input.blur();
                if (e.key === 'Escape') { element.textContent = currentValue || '-'; }
            };
            element.textContent = '';
            element.appendChild(input);
            input.focus();
            input.select();
        }

        // Toggle Task Completion
        async function toggleTask(batchId, completed) {
            const task = tasks.find(t => t.batchId === batchId);
            if (task) {
                task.completed = completed;

                // Update row styling
                const row = document.querySelector(`tr[data-batch-id="${batchId}"]`);
                if (row) {
                    row.classList.toggle('completed', completed);
                }

                // Update stats
                updateStats();

                // Try to sync with API
                try {
                    await fetch(`${API_URL}?action=updateTaskCompletion&batchId=${batchId}&completed=${completed}`);
                } catch (e) {
                }
            }
        }

        // Save Progress
        async function saveProgress() {
            showToast('Saving progress...', 'warning');

            try {
                for (const task of tasks) {
                    if (task.completed) {
                        await fetch(`${API_URL}?action=updateTaskCompletion&batchId=${task.batchId}&completed=true`);
                    }
                }
                showToast('Progress saved!', 'success');
            } catch (error) {
                showToast('Could not save - check connection', 'error');
            }
        }

        // Print Sheet
        function printSheet() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const config = taskTypeConfig[currentTaskType];
            const dateField = config.dateField;

            // Sort tasks for print
            let sortedTasks = [...tasks];
            if (currentSort === 'date') {
                sortedTasks.sort((a, b) => new Date(a[dateField]) - new Date(b[dateField]) || a.crop.localeCompare(b.crop));
            } else {
                sortedTasks.sort((a, b) => a.crop.localeCompare(b.crop));
            }

            // Build column definitions for TinySeedPrint.sheet()
            let columns, rowMapper;

            if (currentTaskType === 'ghSow') {
                columns = [
                    { key: 'date',    label: 'Date',    width: 60 },
                    { key: 'crop',    label: 'Crop',    width: 120 },
                    { key: 'variety', label: 'Variety' },
                    { key: 'trays',   label: 'Trays',   width: 50 },
                    { key: 'cells',   label: 'Cells',   width: 50 },
                    { key: 'seeds',   label: 'Seeds',   width: 55 },
                    { key: 'notes',   label: 'Notes',   width: 90 }
                ];
                rowMapper = function(task) {
                    var seeds = task.seedsNeeded > 0 ? task.seedsNeeded
                        : (task.trays > 0 && task.cellsPerTray > 0) ? Math.ceil(task.trays * task.cellsPerTray * 1.05) : '';
                    return {
                        date: formatDateShort(task[dateField]),
                        crop: task.crop,
                        variety: task.variety,
                        trays: String(task.trays || ''),
                        cells: String(task.cellsPerTray || ''),
                        seeds: String(seeds),
                        notes: task.notes || '',
                        _groupDate: task[dateField],
                        _groupCrop: task.crop
                    };
                };
            } else if (currentTaskType === 'transplant') {
                columns = [
                    { key: 'date',     label: 'Date',     width: 60 },
                    { key: 'crop',     label: 'Crop',     width: 120 },
                    { key: 'variety',  label: 'Variety' },
                    { key: 'plants',   label: 'Plants',   width: 55 },
                    { key: 'location', label: 'Location', width: 80 },
                    { key: 'from',     label: 'From',     width: 70 }
                ];
                rowMapper = function(task) {
                    return {
                        date: formatDateShort(task[dateField]),
                        crop: task.crop,
                        variety: task.variety,
                        plants: String(task.plants || ''),
                        location: task.location || '-',
                        from: task.fromTray || '-',
                        _groupDate: task[dateField],
                        _groupCrop: task.crop
                    };
                };
            } else if (currentTaskType === 'directSeed') {
                columns = [
                    { key: 'date',     label: 'Date',     width: 60 },
                    { key: 'crop',     label: 'Crop',     width: 120 },
                    { key: 'variety',  label: 'Variety' },
                    { key: 'feet',     label: 'Feet',     width: 55 },
                    { key: 'seeds',    label: 'Seeds',    width: 65 },
                    { key: 'location', label: 'Location', width: 80 }
                ];
                rowMapper = function(task) {
                    return {
                        date: formatDateShort(task[dateField]),
                        crop: task.crop,
                        variety: task.variety,
                        feet: (task.feet || '') + (task.feet ? ' ft' : ''),
                        seeds: (task.seedsNeeded || 0).toLocaleString(),
                        location: task.location || '-',
                        _groupDate: task[dateField],
                        _groupCrop: task.crop
                    };
                };
            }

            // Map sorted tasks to row objects
            const rows = sortedTasks.map(rowMapper);

            // Determine groupBy key based on current sort
            const groupBy = currentSort === 'date' ? '_groupDate' : '_groupCrop';

            // Build germination notes as an extra section (GH Sowing only)
            const sections = [];
            if (currentTaskType === 'ghSow') {
                const uniqueGermNotes = [...new Map(tasks.filter(t => t.germInstructions).map(t => [t.crop, t])).values()];
                if (uniqueGermNotes.length > 0) {
                    sections.push({
                        title: 'GERMINATION NOTES',
                        text: uniqueGermNotes.map(t =>
                            t.crop + ': ' + (t.germTemp ? t.germTemp + ' - ' : '') + t.germInstructions
                        ).join('\n')
                    });
                }
            }

            // Call TinySeedPrint.sheet() with structured data
            TinySeedPrint.sheet({
                title: config.title,
                subtitle: formatDateDisplay(startDate) + ' - ' + formatDateDisplay(endDate),
                columns: columns,
                rows: rows,
                groupBy: groupBy,
                sections: sections,
                orientation: 'portrait'
            }).catch(function(err) {
                console.error('Print failed:', err);
                alert('Print failed: ' + err.message);
            });
        }

        // Get print summary HTML based on task type
        function getPrintSummaryHTML() {
            if (currentTaskType === 'ghSow') {
                return `
                    <div class="summary-grid">
                        <div class="summary-box">
                            <div class="summary-title">Tray Counts</div>
                            ${Object.entries(summary.traysBySize || {}).map(([size, count]) => `
                                <div class="summary-row">
                                    <span>${size}-cell trays</span>
                                    <span>${count}</span>
                                </div>
                            `).join('')}
                            <div class="summary-row summary-total">
                                <span>TOTAL TRAYS</span>
                                <span>${summary.totalTrays || 0}</span>
                            </div>
                        </div>
                        <div class="summary-box">
                            <div class="summary-title">Seeds Needed</div>
                            ${(summary.seedsNeeded || []).slice(0, 6).map(s => `
                                <div class="summary-row">
                                    <span>${s.crop}</span>
                                    <span>${s.seeds.toLocaleString()}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTaskType === 'transplant') {
                return `
                    <div class="summary-grid">
                        <div class="summary-box">
                            <div class="summary-title">Plants by Location</div>
                            ${Object.entries(summary.byLocation || {}).map(([loc, count]) => `
                                <div class="summary-row">
                                    <span>${loc}</span>
                                    <span>${count.toLocaleString()}</span>
                                </div>
                            `).join('')}
                            <div class="summary-row summary-total">
                                <span>TOTAL PLANTS</span>
                                <span>${summary.totalPlants || tasks.reduce((sum, t) => sum + (t.plants || 0), 0)}</span>
                            </div>
                        </div>
                        <div class="summary-box">
                            <div class="summary-title">Task Overview</div>
                            <div class="summary-row">
                                <span>Total Tasks</span>
                                <span>${tasks.length}</span>
                            </div>
                            <div class="summary-row">
                                <span>Unique Crops</span>
                                <span>${[...new Set(tasks.map(t => t.crop))].length}</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTaskType === 'directSeed') {
                return `
                    <div class="summary-grid">
                        <div class="summary-box">
                            <div class="summary-title">Seeding Summary</div>
                            <div class="summary-row summary-total">
                                <span>TOTAL BED FEET</span>
                                <span>${summary.totalFeet || tasks.reduce((sum, t) => sum + (t.feet || 0), 0)}</span>
                            </div>
                            <div class="summary-row">
                                <span>Total Seeds</span>
                                <span>${(summary.totalSeeds || tasks.reduce((sum, t) => sum + (t.seedsNeeded || 0), 0)).toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="summary-box">
                            <div class="summary-title">Task Overview</div>
                            <div class="summary-row">
                                <span>Total Tasks</span>
                                <span>${tasks.length}</span>
                            </div>
                            <div class="summary-row">
                                <span>Unique Crops</span>
                                <span>${[...new Set(tasks.map(t => t.crop))].length}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            return '';
        }

        // Get footer summary based on task type
        function getFooterSummary() {
            if (currentTaskType === 'ghSow') {
                return `${summary.totalTrays || 0} trays total`;
            } else if (currentTaskType === 'transplant') {
                return `${summary.totalPlants || tasks.reduce((sum, t) => sum + (t.plants || 0), 0)} plants total`;
            } else if (currentTaskType === 'directSeed') {
                return `${summary.totalFeet || tasks.reduce((sum, t) => sum + (t.feet || 0), 0)} bed feet total`;
            }
            return '';
        }

        function printTaskRow(task) {
            const config = taskTypeConfig[currentTaskType];
            const taskDate = task[config.dateField];

            if (currentTaskType === 'ghSow') {
                const seeds = task.seedsNeeded > 0 ? task.seedsNeeded
                    : (task.trays > 0 && task.cellsPerTray > 0) ? Math.ceil(task.trays * task.cellsPerTray * 1.05) : '-';
                return `
                    <tr>
                        <td style="text-align: center;"><div class="checkbox"></div></td>
                        <td>${formatDateShort(taskDate)}</td>
                        <td>${task.crop}</td>
                        <td>${task.variety}</td>
                        <td style="font-weight: 600;">${task.trays}</td>
                        <td>${task.cellsPerTray}</td>
                        <td style="font-weight: 600; color: #d97706;">${seeds}</td>
                        <td style="font-size: 9pt; color: #555;">${task.notes || ''}</td>
                    </tr>
                `;
            } else if (currentTaskType === 'transplant') {
                return `
                    <tr>
                        <td style="text-align: center;"><div class="checkbox"></div></td>
                        <td>${formatDateShort(taskDate)}</td>
                        <td>${task.crop}</td>
                        <td>${task.variety}</td>
                        <td style="font-weight: 600;">${task.plants}</td>
                        <td>${task.location || '-'}</td>
                        <td>${task.fromTray || '-'}</td>
                    </tr>
                `;
            } else if (currentTaskType === 'directSeed') {
                return `
                    <tr>
                        <td style="text-align: center;"><div class="checkbox"></div></td>
                        <td>${formatDateShort(taskDate)}</td>
                        <td>${task.crop}</td>
                        <td>${task.variety}</td>
                        <td style="font-weight: 600;">${task.feet} ft</td>
                        <td>${(task.seedsNeeded || 0).toLocaleString()}</td>
                        <td>${task.location || '-'}</td>
                    </tr>
                `;
            }
            return '';
        }

        // Toast Notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = toast.querySelector('i');

            toast.className = `toast ${type}`;
            icon.className = type === 'success' ? 'fas fa-check-circle' :
                            type === 'error' ? 'fas fa-exclamation-circle' :
                            'fas fa-info-circle';

            document.getElementById('toastMessage').textContent = message;
            toast.classList.add('show');

            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
