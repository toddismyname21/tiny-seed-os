services:
  - type: web
    name: tinypm-brain
    env: python
    buildCommand: pip install -r requirements_brain.txt
    startCommand: python brain_bridge.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
